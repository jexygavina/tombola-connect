<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tombola Connect — Carnet</title>
<link rel="stylesheet" href="../assets/tombola.css" />
</head>
<body>
<div class="page">
  <div class="marque-editeur">
    <svg viewBox="0 0 40 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="6" y="8" width="16" height="16" rx="3" transform="rotate(45 14 16)" stroke="currentColor" stroke-width="3"/>
      <rect x="18" y="8" width="16" height="16" rx="3" transform="rotate(45 26 16)" stroke="currentColor" stroke-width="3"/>
    </svg>
    <span>paperlin</span>
  </div>
  <div class="accent-carres" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <header class="entete">
    <h1 id="titre-carnet">Chargement…</h1>
    <p id="sous-titre-carnet"></p>
  </header>

  <div class="carte" id="carte-description" hidden>
    <p id="description-carnet"></p>
  </div>

  <div class="carte" id="carte-organisation" hidden>
    <h2 id="organisation-nom"></h2>
    <p id="organisation-presentation"></p>
    <p class="discret" id="organisation-contact"></p>
  </div>

  <div class="carte">
    <h2>Lots à gagner</h2>
    <p id="message-pas-de-lots" class="discret" hidden>Aucun lot n'a encore été ajouté par l'organisateur.</p>
    <ul class="liste-lots" id="liste-lots"></ul>
  </div>

  <div class="carte">
    <h2>Vérifier mon billet</h2>
    <p class="discret">Aucune information personnelle n'est demandée : seul le code compte.</p>
    <label for="champ-code">Code du billet</label>
    <input type="text" id="champ-code" placeholder="Ex : A-00123" autocomplete="off" />
    <button type="button" id="bouton-verifier">Vérifier mon billet</button>
    <div id="message-verification" class="message" hidden></div>
  </div>

  <p class="discret" style="text-align:center">
    Cette page se met à jour automatiquement pendant le tirage : inutile de la recharger.
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/tombola.js"></script>
<script>
  const identifiant = identifiantCarnetDepuisUrl();
  // Résolu une fois le carnet trouvé (par id ou par référence imprimée) :
  // tout ce qui suit (RPC, direct) utilise toujours l'identifiant technique.
  let carnetId = null;
  const titreCarnet = document.getElementById("titre-carnet");
  const sousTitreCarnet = document.getElementById("sous-titre-carnet");
  const carteDescription = document.getElementById("carte-description");
  const descriptionCarnet = document.getElementById("description-carnet");
  const listeLots = document.getElementById("liste-lots");
  const messagePasDeLots = document.getElementById("message-pas-de-lots");
  const carteOrganisation = document.getElementById("carte-organisation");
  const organisationNom = document.getElementById("organisation-nom");
  const organisationPresentation = document.getElementById("organisation-presentation");
  const organisationContact = document.getElementById("organisation-contact");
  const champCode = document.getElementById("champ-code");
  const boutonVerifier = document.getElementById("bouton-verifier");
  const messageVerification = document.getElementById("message-verification");

  if (!identifiant) {
    titreCarnet.textContent = "Tombola introuvable";
    sousTitreCarnet.textContent = "Le lien utilisé ne pointe vers aucune tombola.";
  }

  async function chargerEnTete() {
    const { data, error } = await supabaseClient
      .from("carnets")
      .select("id, nom, description, date_tirage, organisation_nom, organisation_presentation, organisation_contact")
      .eq(identifiant.colonne, identifiant.valeur)
      .single();

    if (error || !data) {
      titreCarnet.textContent = "Tombola introuvable";
      sousTitreCarnet.textContent = "Vérifiez le lien fourni par l'organisateur.";
      return;
    }

    carnetId = data.id;
    titreCarnet.textContent = data.nom;
    sousTitreCarnet.textContent = "Tirage : " + formaterDate(data.date_tirage);
    if (data.description) {
      descriptionCarnet.textContent = data.description;
      carteDescription.hidden = false;
    }

    if (data.organisation_nom || data.organisation_presentation || data.organisation_contact) {
      organisationNom.textContent = data.organisation_nom || "Organisé par";
      organisationPresentation.textContent = data.organisation_presentation || "";
      organisationContact.textContent = data.organisation_contact || "";
      carteOrganisation.hidden = false;
    }
  }

  // Les résultats (lots + code gagnant une fois tiré) passent toujours par
  // la fonction RPC resultats_carnet : jamais de lecture directe des
  // billets, même côté page publique.
  async function chargerResultats() {
    const { data, error } = await supabaseClient.rpc("resultats_carnet", {
      p_carnet_id: carnetId,
    });

    if (error || !data) return;

    if (data.length === 0) {
      messagePasDeLots.hidden = false;
      listeLots.innerHTML = "";
      return;
    }

    messagePasDeLots.hidden = true;
    listeLots.innerHTML = data
      .map((lot) => {
        const etat = lot.code_gagnant
          ? `<span class="lot-gagnant">${lot.code_gagnant}</span>`
          : `<span class="lot-en-attente">pas encore tiré</span>`;
        return `<li>
          <span class="lot-rang">${lot.rang}</span>
          <span class="lot-nom">${lot.nom_lot}</span>
          ${etat}
        </li>`;
      })
      .join("");
  }

  boutonVerifier.addEventListener("click", async () => {
    const code = champCode.value.trim();
    if (!code) {
      afficherMessage(messageVerification, "Indiquez le code inscrit sur votre billet.", "erreur");
      return;
    }

    boutonVerifier.disabled = true;
    const { data, error } = await supabaseClient.rpc("verifier_billet", {
      p_carnet_id: carnetId,
      p_code: code,
    });
    boutonVerifier.disabled = false;

    if (error) {
      afficherMessage(messageVerification, "Une erreur est survenue, réessayez.", "erreur");
      return;
    }

    const resultat = data && data[0];
    if (!resultat || !resultat.existe) {
      afficherMessage(messageVerification, "Ce code n'est pas enregistré pour cette tombola.", "erreur");
    } else if (resultat.gagnant) {
      afficherMessage(messageVerification, `🎉 Bravo, ce billet a gagné : ${resultat.nom_lot} (lot n°${resultat.rang}) !`, "succes");
    } else {
      afficherMessage(messageVerification, "Ce billet est bien enregistré. Le tirage n'a pas (encore) désigné ce billet comme gagnant.", "info");
    }
  });

  // Direct : dès qu'un lot change (organisateur qui tire au sort), on
  // redemande les résultats complets via resultats_carnet, seule habilitée
  // à révéler le code du billet gagnant.
  function ecouterLeDirect() {
    if (!carnetId) return;
    supabaseClient
      .channel("lots-carnet-" + carnetId)
      .on(
        "postgres_changes",
        { event: "UPDATE", schema: "public", table: "lots", filter: "carnet_id=eq." + carnetId },
        () => chargerResultats()
      )
      .subscribe();
  }

  async function demarrer() {
    if (!identifiant) return;
    await chargerEnTete();
    if (!carnetId) return;
    chargerResultats();
    ecouterLeDirect();
  }

  demarrer();
</script>
</body>
</html>
